<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0a1024" />
  <title>Panel · Radio Demo 100.0 FM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/styles.css" />
  <!-- Define window.__PB_URL__ desde el entorno del servidor. Va antes que app.js:
       los scripts clásicos se ejecutan en orden. Ver src/app/api/pb-config/. -->
  <script src="/api/pb-config"></script>
  <script src="/admin/pocketbase.umd.js"></script>
  <script src="/admin/chart.umd.js"></script>
  <script src="/admin/jspdf.umd.min.js"></script>
  <script src="/admin/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <!-- LOGIN -->
  <section id="login" class="login">
    <div class="login-bg"></div>
    <form id="login-form" class="login-card">
      <div class="login-logo">
        <img src="/assets/logo.webp" alt="Radio Demo" />
      </div>
      <h1>Radio Demo</h1>
      <p class="muted">Panel de administración · 100.0 FM</p>
      <label>Correo
        <input type="email" id="login-email" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="tucorreo@dominio.com" required />
      </label>
      <label>Contraseña
        <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••" required />
      </label>
      <button type="submit" id="login-btn">Entrar</button>
      <p id="login-error" class="error" hidden></p>
      <a href="/" class="back-link">← Volver a la emisora</a>
    </form>
  </section>

  <!-- APP -->
  <section id="app" hidden>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark">
            <img src="/assets/logo.webp" alt="Radio Demo" />
          </span>
          <span class="brand-text">Radio Demo<small>Panel admin</small></span>
        </div>
        <nav class="tabs">
          <button data-tab="general" class="active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>General</span>
          </button>
          <button data-tab="redes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            <span>Redes</span>
          </button>
          <button data-tab="programacion">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Programación</span>
          </button>
          <button data-tab="publicidad">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
            <span>Publicidad</span>
          </button>
          <button data-tab="chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span>Chat</span>
            <span class="nav-badge" id="chat-nav-badge" hidden>0</span>
          </button>
          <button data-tab="reportes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Reportes</span>
          </button>
        </nav>
        <a href="/" class="logout-btn site-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
          <span>Ver la emisora</span>
        </a>
        <button id="logout" class="logout-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Salir</span>
        </button>
      </aside>

      <div class="scrim" id="scrim"></div>

      <div class="main">
        <header class="topbar">
          <button id="menu-toggle" class="icon-btn" aria-label="Menú">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 id="page-title">General</h1>
          <span class="spacer"></span>
          <span class="live-badge" id="live-badge" hidden><span class="live-dot"></span><b id="live-count">0</b> en vivo</span>
        </header>
        <main>
          <div id="tab-general" class="tab"></div>
          <div id="tab-redes" class="tab" hidden></div>
          <div id="tab-programacion" class="tab" hidden></div>
          <div id="tab-publicidad" class="tab" hidden></div>
          <div id="tab-chat" class="tab" hidden></div>
          <div id="tab-reportes" class="tab" hidden></div>
        </main>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </section>

  <script src="/admin/app.js"></script>
</body>
</html>
